<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>URL Shortener</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: white;
      padding: 30px;
      width: 400px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 15px 0;
    }
    button {
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .result {
      margin-top: 15px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🔗 URL Shortener</h2>
    <input id="longUrl" type="text" placeholder="Enter long URL" />
    <button onclick="shortenUrl()">Shorten</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    async function shortenUrl() {
      const longUrl = document.getElementById("longUrl").value;
      const resultDiv = document.getElementById("result");

      if (!longUrl) {
        resultDiv.innerHTML = "❌ Please enter a URL";
        return;
      }

      try {
        const res = await fetch(
          "https://url-shortener-fastapi-1.onrender.com/shorten",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ long_url: longUrl })
          }
        );

        const data = await res.json();
        resultDiv.innerHTML = `
          ✅ Short URL:<br>
          <a href="${data.short_url}" target="_blank">
            ${data.short_url}
          </a>
        `;
      } catch (err) {
        resultDiv.innerHTML = "❌ Error occurred";
      }
    }
  </script>

</body>
</html>
